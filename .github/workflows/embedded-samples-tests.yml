name: Run tests for embedded samples

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-embedded-samples-tests-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "corretto"
      - name: Check
        run: ./gradlew check --no-daemon
      - name: Publish core for the embedded sample
        run: ./gradlew :mockey-core:publishToMavenLocal --no-daemon
      - name: Check embedded sample
        run: ./gradlew -p samples/embedded test --no-daemon
