name: CI

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest-internal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: 'corretto'
      - name: Check
        run: ./gradlew check --no-daemon
