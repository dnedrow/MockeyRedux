name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: 'corretto'
      - name: Check
        run: ./gradlew check --no-daemon
