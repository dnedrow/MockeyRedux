org.gradle.configuration-cache=true

# The Kotlin compiler daemon compiles the source sets of several modules at the same time. Its default heap
# of 512 MiB is too small for that, so a build from scratch runs out of memory without this setting.
kotlin.daemon.jvmargs=-Xmx2g

group=io.github.dnedrow
version=3.0.0-SNAPSHOT

kotlin.code.style=official
